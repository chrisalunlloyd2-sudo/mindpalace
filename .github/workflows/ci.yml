name: CI smoke
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ci-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  demo-selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Shallow-clone tripwire
        run: |
          n=$(git rev-list --count HEAD)
          echo "commits: $n"
          if [ "$n" -lt 2 ]; then echo "::error::shallow clone (1 commit) - slider-fidelity NPE territory; require fetch-depth: 0"; exit 1; fi
      - name: JDK 17 + Maven cache
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - name: Install Xvfb + Mesa (software GL)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0
      - name: Package (skip tests)
        run: mvn -B -ntp -DskipTests package -Dlwjgl.natives=natives-linux
      - name: Demo selftest (hermetic, Xvfb)
        run: |
          set +e
          JARFILE=$(ls target/mindpalace-*.jar | head -n 1)
          if [ -z "$JARFILE" ]; then echo ::error::no jar in target/ after package; exit 1; fi
          echo jar: $JARFILE
          : > selftest.log
          run_selftest() {
            attempt_log="/tmp/selftest-attempt-$1.log"
            xvfb-run -a -s "-screen 0 1280x720x24" java -jar "$JARFILE" --demo --selftest > "$attempt_log" 2>&1
            attempt_rc=$?
            {
              echo "=== Selftest attempt $1 (exit $attempt_rc) ==="
              cat "$attempt_log"
            } >> selftest.log
            result=$(grep -E 'RESULT:[[:space:]]*[0-9]+ passed, 0 failed' "$attempt_log" | tail -n 1)
            passed=$(printf '%s' "$result" | sed -E 's/.*RESULT:[[:space:]]*([0-9]+).*/\1/')
            if [ "$attempt_rc" -eq 0 ] &&
              [ -n "$passed" ] && [ "$passed" -ge 5 ] &&
              grep -Fq "Demo fixtures loaded: 12 rooms" "$attempt_log" &&
              grep -Fq "PASS demo hermeticity" "$attempt_log"; then
              return 0
            fi
            if [ "$attempt_rc" -ne 0 ]; then return "$attempt_rc"; fi
            return 1
          }
          run_selftest 1
          rc=$?
          if [ "$rc" -eq 0 ]; then
            classification="stable"
            echo "::notice::Selftest stable: first attempt passed"
          else
            echo "::warning::Selftest attempt 1 failed (exit $rc); retrying once"
            run_selftest 2
            retry_rc=$?
            if [ "$retry_rc" -eq 0 ]; then
              classification="flaky"
              rc=0
              echo "::warning::Selftest flaky: first attempt failed, retry passed"
            else
              classification="real failure"
              rc=1
              echo "::error::Selftest real failure: both attempts failed"
            fi
          fi
          echo "### Selftest: $classification" >> "$GITHUB_STEP_SUMMARY"
          tail -n 15 selftest.log >> "$GITHUB_STEP_SUMMARY"
          tail -n 40 selftest.log
          exit $rc
      - name: Assert green (45/0, fixtures, hermeticity)
        shell: pwsh
        run: |
          $log = Get-Content selftest.log -Raw
          # count-agnostic RESULT regex (>=5 checks floor) - survives future count bumps, refs #57
          $m = [regex]::Match($log, 'RESULT:\s*(\d+)\s+passed,\s*0\s+failed')
          $n = if ($m.Success) { [int]$m.Groups[1].Value } else { -1 }
          $checks = @(
            "Demo fixtures loaded: 12 rooms",
            "PASS demo hermeticity"
          )
          if ($n -lt 5) { Write-Host "::error::RESULT line missing, malformed, or degenerate (<5 checks)"; exit 1 }
          $missing = $checks | Where-Object { $log -notmatch [regex]::Escape($_) }
          if ($missing) { $missing | ForEach-Object { Write-Host "::error::missing: $_" }; exit 1 }
          Write-Host "CI smoke GREEN: $n/0, 12 demo rooms, hermeticity PASS"
      - name: Upload selftest log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selftest-log
          path: selftest.log
